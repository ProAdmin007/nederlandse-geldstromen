# Haalt elke maand de nieuwste cijfers op (CBS, OESO, Eurostat, Europese Commissie, landenrapporten),
# controleert ze met de tests en publiceert opnieuw als er iets veranderd is.
name: Data bijwerken

# Staat op handmatig (Actions → "Data bijwerken" → Run workflow). Maandelijks automatisch draaien:
# voeg hieronder weer toe:
#   schedule:
#     - cron: "0 6 15 * *" # de 15e van elke maand, 06:00 UTC
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:fetch
      # Nieuwe landenrapporten van techbedrijven (via Taxplorer) toevoegen
      - id: cbcr
        run: npm run data:cbcr
      - run: npm run data:build
      - run: npm test
      - id: commit
        run: |
          if git diff --quiet -- data public/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data public/data
            git commit -m "Data bijgewerkt ($(date +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Meld nieuwe landenrapporten in een issue, zodat iemand ze kan nalopen
      - if: steps.cbcr.outputs.new != '0' && steps.cbcr.outputs.new != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Nieuwe landenrapporten toegevoegd ($(date +%Y-%m))" \
            --body "Er zijn ${{ steps.cbcr.outputs.new }} nieuwe regels uit landenrapporten automatisch toegevoegd aan data/belasting.json. Zie de samenvatting van deze workflow-run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Publiceren alleen als de repository-variabele PUBLISH_SITE op "true" staat
  # (Settings → Secrets and variables → Actions → Variables). Zolang die niet bestaat, gaat er niets live.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' && vars.PUBLISH_SITE == 'true'
    uses: ./.github/workflows/pages.yml
